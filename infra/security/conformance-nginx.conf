# TLS front of the OpenID conformance suite's server (in the same pod, on 8080), as the suite's
# own nginx/nginx.conf does, with our certificate and the in-cluster name. Keycloak redirects the
# suite's browser automation to https://conformance.security.svc/test/a/<alias>/callback.
events {}
http {
    access_log /dev/stdout;
    error_log  /dev/stderr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 20m;
    server {
        listen 8443 ssl;
        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header X-Ssl-Cert $ssl_client_cert;
            proxy_set_header X-Test-Mtls-Called-On-Wrong-Host "";
        }
    }
}
