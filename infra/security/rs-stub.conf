# Stage 1 stand-in for the transmitter as resource server (it takes the transmitter's place in
# stage 2): the conformance suite creates a consent at consentUrl and calls resourceUrl with the
# access token, and checks the status, the JSON content type, the Date header and the echoed
# x-fapi-interaction-id. Only the presence of a bearer token is checked; Keycloak is what is
# under test.
# The permissions are the conformance suite's for a personal consent
# (FAPIBrazilOpenBankingCreateConsentRequest), so the requested ones are all granted.
events {}
http {
    access_log /dev/stdout;
    error_log  /dev/stderr;
    server {
        listen 8443 ssl;
        ssl_certificate        /tls/tls.crt;
        ssl_certificate_key    /tls/tls.key;
        ssl_client_certificate /tls/ca.pem;
        ssl_verify_client      optional;
        # FAPI-BR v2.2.0 6.4 (the suite checks the resource server's TLS too).
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_tickets off;
        default_type "application/json; charset=utf-8";
        add_header x-fapi-interaction-id $http_x_fapi_interaction_id always;

        # A bearer token in the Authorization header (the scheme in any case, RFC 6750), or 401:
        # FAPI 1 forbids it in the query, and the suite checks that such a request is refused.
        if ($http_authorization !~* "^Bearer .+") {
            return 401 '{"errors":[{"code":"UNAUTHORIZED","title":"Unauthorized","detail":"No bearer token"}],"meta":{"totalRecords":1,"totalPages":1,"requestDateTime":"2026-11-27T00:00:00Z"}}';
        }

        location = /open-banking/consents/v3/consents {
            if ($request_method != POST) { return 405; }
            return 201 '{"data":{"consentId":"urn:ofar:stub-consent","status":"AWAITING_AUTHORISATION","creationDateTime":"2026-11-27T00:00:00Z","statusUpdateDateTime":"2026-11-27T00:00:00Z","permissions":["CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ","RESOURCES_READ","CUSTOMERS_PERSONAL_ADITTIONALINFO_READ","ACCOUNTS_READ","ACCOUNTS_BALANCES_READ","ACCOUNTS_OVERDRAFT_LIMITS_READ","ACCOUNTS_TRANSACTIONS_READ","CREDIT_CARDS_ACCOUNTS_LIMITS_READ","CREDIT_CARDS_ACCOUNTS_READ","CREDIT_CARDS_ACCOUNTS_BILLS_READ","CREDIT_CARDS_ACCOUNTS_TRANSACTIONS_READ","CREDIT_CARDS_ACCOUNTS_BILLS_TRANSACTIONS_READ","LOANS_READ","LOANS_WARRANTIES_READ","LOANS_SCHEDULED_INSTALMENTS_READ","LOANS_PAYMENTS_READ","FINANCINGS_READ","FINANCINGS_WARRANTIES_READ","FINANCINGS_SCHEDULED_INSTALMENTS_READ","FINANCINGS_PAYMENTS_READ","UNARRANGED_ACCOUNTS_OVERDRAFT_READ","UNARRANGED_ACCOUNTS_OVERDRAFT_WARRANTIES_READ","UNARRANGED_ACCOUNTS_OVERDRAFT_SCHEDULED_INSTALMENTS_READ","UNARRANGED_ACCOUNTS_OVERDRAFT_PAYMENTS_READ","INVOICE_FINANCINGS_READ","INVOICE_FINANCINGS_WARRANTIES_READ","INVOICE_FINANCINGS_SCHEDULED_INSTALMENTS_READ","INVOICE_FINANCINGS_PAYMENTS_READ"]},"links":{"self":"https://rs-stub.security.svc/open-banking/consents/v3/consents/urn:ofar:stub-consent"},"meta":{"requestDateTime":"2026-11-27T00:00:00Z"}}';
        }
        location = /open-banking/accounts/v2/accounts {
            return 200 '{"data":[],"links":{"self":"https://rs-stub.security.svc/open-banking/accounts/v2/accounts"},"meta":{"totalRecords":0,"totalPages":1,"requestDateTime":"2026-11-27T00:00:00Z"}}';
        }
        location / {
            return 404 '{"errors":[{"code":"NOT_FOUND","title":"Not found","detail":"Not found"}],"meta":{"totalRecords":1,"totalPages":1,"requestDateTime":"2026-11-27T00:00:00Z"}}';
        }
    }
}
