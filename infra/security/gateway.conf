# The transmitter's mTLS gateway (FAPI-BR stage 2): TLS as v2.2.0 6.4 wants it (the suite checks
# the resource server's TLS too), the client certificate requested and verified against our CA,
# and every request forwarded to the transmitter with the certificate nginx verified and the
# gateway's marker. The transmitter checks the token against both (services/transmitter
# security.py); a request without a certificate reaches it and is refused there, in the specs'
# error envelope. Headers of the same names sent by the client are replaced.
events {}
http {
    access_log /dev/stdout;
    error_log  /dev/stderr;
    server {
        listen 8443 ssl;
        ssl_certificate        /tls/tls.crt;
        ssl_certificate_key    /tls/tls.key;
        ssl_client_certificate /tls/ca.pem;
        ssl_verify_client      optional;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_tickets off;

        location /open-banking/ {
            proxy_pass http://transmitter.ofb.svc;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header x-ofar-gateway "1";
            proxy_set_header x-ofar-client-cert $ssl_client_escaped_cert;
            # The transmitter's error responses are its own (the specs' envelope).
            proxy_intercept_errors off;
        }
        # Only the Open Finance APIs: not the transmitter's stand-ins (/mock) or probes.
        location / {
            default_type "application/json; charset=utf-8";
            return 404 '{"errors":[{"code":"NAO_ENCONTRADO","title":"Recurso não encontrado","detail":"Not found"}],"meta":{"totalRecords":1,"totalPages":1,"requestDateTime":"2026-11-27T00:00:00Z"}}';
        }
    }
}
