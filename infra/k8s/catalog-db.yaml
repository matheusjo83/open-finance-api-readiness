# Postgres for the Iceberg JDBC catalog. The Spark jobs connect to iceberg-catalog-rw.storage.svc;
# Iceberg creates its catalog tables (iceberg_tables, iceberg_namespace_properties) on first use.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: iceberg-catalog
  namespace: storage
spec:
  instances: 1
  # Default image of CloudNativePG 1.30.1, pinned.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: iceberg
      owner: iceberg
      secret:
        name: iceberg-catalog-owner
