# Synthetic Open Finance transmitter (services/transmitter): Consents 3.3.1 and Accounts 2.4.2
# over a seeded dataset. In-cluster URL: http://transmitter.ofb.svc; as FAPI-BR resource server,
# https://gateway.security.svc (infra/k8s/security.yaml). The Secret transmitter-security (made by
# make security-deploy, which then restarts the pod) holds its credentials for Keycloak; without
# it, requests through the gateway are refused and the stand-ins work as before.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmitter
  namespace: ofb
  labels: { app: transmitter }
spec:
  # One replica: consents live in memory.
  replicas: 1
  selector:
    matchLabels: { app: transmitter }
  template:
    metadata:
      labels: { app: transmitter }
      annotations:
        # make transmitter-deploy writes a hash of the image's build inputs here: changed inputs
        # roll the pod, unchanged ones leave it alone.
        ofar/image-id: unset
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: transmitter
          # Built locally and loaded into kind (make transmitter-image).
          image: ofar/transmitter:local
          imagePullPolicy: Never
          env:
            - { name: TRANSMITTER_SEED, value: "42" }
            - { name: TRANSMITTER_CUSTOMERS, value: "5" }
            - { name: TRANSMITTER_ISSUER, value: "https://keycloak.security.svc/realms/ofb" }
            - { name: TRANSMITTER_CLIENT_ID, value: ofar-transmitter }
            - { name: TRANSMITTER_SECURITY_DIR, value: /security }
            # The seeded consents belong to the walk's client (through the gateway a client sees
            # only its own consents).
            - { name: TRANSMITTER_SEED_CLIENT, value: ofar-walker }
            # The scheme of the self links from the gateway's X-Forwarded-Proto (uvicorn trusts only
            # 127.0.0.1 by default; the Service is in-cluster only).
            - { name: FORWARDED_ALLOW_IPS, value: "*" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: security, mountPath: /security, readOnly: true }
      volumes:
        - name: security
          secret: { secretName: transmitter-security, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: transmitter
  namespace: ofb
spec:
  selector: { app: transmitter }
  ports:
    - { name: http, port: 80, targetPort: http }
