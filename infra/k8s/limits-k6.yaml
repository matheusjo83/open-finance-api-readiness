# The limits load (docs/limits.md): k6 runs infra/k6/limits.js (ConfigMap limits-k6) through the
# limits proxy, logging one record per request; then the validator's image uploads that log to
# s3://lakehouse/limits/client/run=<the proxy's run id>/ and flushes the proxy's labels.
# make limits restarts the transmitter and the proxy, then deletes the previous Job and applies this one.
apiVersion: batch/v1
kind: Job
metadata:
  name: limits-k6
  namespace: ofb
  labels: { app: limits-k6 }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app: limits-k6 }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: script
          configMap: { name: limits-k6 }
        - name: out
          emptyDir: { sizeLimit: 256Mi }
      initContainers:
        - name: k6
          # k6 2.3.0 (decision 40), pulled by digest from Docker Hub: kind cannot load this
          # multi-platform image from the local store.
          image: grafana/k6@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
          args: ["run", "--quiet", "--no-color", "--log-format=json", "--log-output=file=/out/requests.log",
                 "-e", "BASE=http://proxy-limits.ofb.svc", "/scripts/limits.js"]
          volumeMounts:
            - { name: script, mountPath: /scripts }
            - { name: out, mountPath: /out }
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            # The upload container (the validator image, user 65532) reads the log k6 writes (mode 600).
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: upload
          # Built locally and loaded into kind (make validator-image).
          image: ofar/contract-validator:local
          imagePullPolicy: Never
          command: ["python", "-m", "contract_validator.limits_log", "/out/requests.log"]
          env:
            - { name: TARGET, value: "http://proxy-limits.ofb.svc" }
            - { name: S3_ENDPOINT, value: "http://seaweedfs-all-in-one.storage.svc:8333" }
            - { name: RESULTS_BUCKET, value: lakehouse }
            - { name: AWS_REGION, value: us-east-1 }
          envFrom:
            - secretRef: { name: validator-credentials }
          volumeMounts:
            - { name: out, mountPath: /out, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
