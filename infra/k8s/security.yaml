# The OpenID conformance suite (FAPI-BR, backlog item 19) that tests the transmitter's
# authorisation server and the transmitter as resource server (auth.yaml): make security-deploy.
# The images are pulled by digest from their registries (decision 46).
# The OpenID conformance suite (release-v5.3.5, MIT): its server in dev mode (no login), behind
# an nginx TLS front as in its docker-compose.yml, and its MongoDB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conformance
  namespace: security
  labels: { app: conformance }
spec:
  replicas: 1
  selector:
    matchLabels: { app: conformance }
  template:
    metadata:
      labels: { app: conformance }
      annotations:
        ofar/config-id: unset
    spec:
      containers:
        - name: server
          image: registry.gitlab.com/openid/conformance-suite:release-v5.3.5@sha256:576ad9d6ea4230a6d58623a03c17c74e2ae1438cceec252f8721daa53a705961
          env:
            - { name: BASE_URL, value: "https://conformance.security.svc" }
            - { name: BASE_MTLS_URL, value: "https://conformance.security.svc" }
            - { name: MONGODB_HOST, value: conformance-mongo }
            - { name: SPRING_PROFILES_ACTIVE, value: dev }
            # The server will not start without login providers; dev mode never uses them. These
            # are the placeholders of the suite's docker-compose.yml.
            - { name: OIDC_GOOGLE_CLIENTID, value: google-client }
            - { name: OIDC_GOOGLE_SECRET, value: google-secret }
            - { name: OIDC_GITLAB_CLIENTID, value: gitlab-client }
            - { name: OIDC_GITLAB_SECRET, value: gitlab-secret }
            - { name: JAVA_EXTRA_ARGS, value: "-XX:MaxRAMPercentage=70" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 3
            failureThreshold: 100
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
        - name: nginx
          image: registry.gitlab.com/openid/conformance-suite/nginx:release-v5.3.5@sha256:fd5ae05bf2a8f246f600b16a198dd670051bbad44f0b59d903da6e294e02707d
          ports:
            - { name: https, containerPort: 8443 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: nginx, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: conformance-tls }
        - name: nginx
          configMap: { name: conformance-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: conformance
  namespace: security
spec:
  selector: { app: conformance }
  ports:
    - { name: https, port: 443, targetPort: https }
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conformance-mongo
  namespace: security
  labels: { app: conformance-mongo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: conformance-mongo }
  template:
    metadata:
      labels: { app: conformance-mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:6.0.13@sha256:b415b12f638e2685d06c58ab7fb5943577c50fadec6d9340ef67d21aeac72070
          ports:
            - { name: mongo, containerPort: 27017 }
          readinessProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: conformance-mongo
  namespace: security
spec:
  selector: { app: conformance-mongo }
  ports:
    - { name: mongo, port: 27017, targetPort: mongo }
