# LOCAL DEVELOPMENT ONLY: fixed credentials for the kind cluster, never reused elsewhere.
# The S3 keys must match s3.credentials.admin in infra/helm/seaweedfs.yaml.
#
# Owner of the Iceberg catalog database (CloudNativePG bootstrap).
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-catalog-owner
  namespace: storage
type: kubernetes.io/basic-auth
stringData:
  username: iceberg
  password: iceberg-local-dev
---
# What the Spark jobs use to reach the catalog and the object store.
apiVersion: v1
kind: Secret
metadata:
  name: lakehouse-credentials
  namespace: spark
type: Opaque
stringData:
  CATALOG_USER: iceberg
  CATALOG_PASSWORD: iceberg-local-dev
  S3_ACCESS_KEY_ID: lakehouse-local-dev
  S3_SECRET_ACCESS_KEY: lakehouse-local-dev-secret
