# SeaweedFS (chart 4.54.0) in all-in-one mode: master, volume, filer and the S3 gateway
# in one pod (service seaweedfs-all-in-one.storage.svc, S3 on port 8333). Data in emptyDir:
# the local cluster is disposable, the tables are rebuilt by the jobs.
master:
  enabled: false
volume:
  enabled: false
filer:
  enabled: false

allInOne:
  enabled: true
  data:
    type: emptyDir
  s3:
    enabled: true
    enableAuth: true
    createBuckets:
      - name: lakehouse
        anonymousRead: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

s3:
  enableAuth: true
  # LOCAL DEVELOPMENT ONLY; must match infra/k8s/dev-credentials.yaml.
  credentials:
    admin:
      accessKey: lakehouse-local-dev
      secretKey: lakehouse-local-dev-secret
    read:
      accessKey: lakehouse-local-read
      secretKey: lakehouse-local-read-secret
