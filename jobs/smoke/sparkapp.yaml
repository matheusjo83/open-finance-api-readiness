apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: smoke
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  # Built locally and loaded into kind (make image).
  image: ofar/spark:local
  imagePullPolicy: Never
  sparkVersion: 3.5.9
  mainApplicationFile: local:///opt/jobs/smoke/smoke.py
  deps:
    pyFiles:
      - local:///opt/jobs/lib/lakehouse.py
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: 768m
    serviceAccount: spark
    envFrom:
      - configMapRef:
          name: lakehouse-config
      - secretRef:
          name: lakehouse-credentials
  executor:
    instances: 1
    cores: 1
    memory: 768m
    envFrom:
      - configMapRef:
          name: lakehouse-config
      - secretRef:
          name: lakehouse-credentials
