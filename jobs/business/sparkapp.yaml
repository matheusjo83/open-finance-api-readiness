# Business-rules job (jobs/business): one validation run from s3a://lakehouse/ into the Iceberg
# tables lake.ofb.* (docs/business-rules.md). make business-rules fills in the run id (the
# proxy's current run unless RUN_ID is set).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: business-rules
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  # Built locally and loaded into kind (make image).
  image: ofar/spark:local
  imagePullPolicy: Never
  sparkVersion: 3.5.9
  mainApplicationFile: local:///opt/jobs/business/job.py
  arguments: ["--run-id", "RUN_ID"]
  deps:
    pyFiles:
      - local:///opt/jobs/lib/lakehouse.py
      - local:///opt/jobs/business/rules.py
  sparkConf:
    # Small inputs: a few shuffle partitions instead of 200.
    spark.sql.shuffle.partitions: "4"
    spark.sql.session.timeZone: UTC
  restartPolicy:
    type: Never
  # The heap stays at 1g; the overhead (off-heap) goes from the default 384m to 768m, as for the
  # detection report: executors were OOMKilled in the focused campaign of 2026-11-23 (decision 37).
  driver:
    cores: 1
    memory: 1g
    memoryOverhead: 768m
    serviceAccount: spark
    envFrom:
      - configMapRef:
          name: lakehouse-config
      - secretRef:
          name: lakehouse-credentials
  executor:
    instances: 1
    cores: 1
    memory: 1g
    memoryOverhead: 768m
    envFrom:
      - configMapRef:
          name: lakehouse-config
      - secretRef:
          name: lakehouse-credentials
