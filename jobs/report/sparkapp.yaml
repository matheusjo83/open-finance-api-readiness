# Detection report (jobs/report): joins validation runs with the proxy's labels, writes
# lake.ofb.detection_* and s3a://lakehouse/reports/<name>/report.md (docs/report.md).
# make report fills in the runs (the proxy's current run unless RUNS is set); make report-smoke
# adds --gate.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: detection-report
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  # Built locally and loaded into kind (make image).
  image: ofar/spark:local
  imagePullPolicy: Never
  sparkVersion: 3.5.9
  mainApplicationFile: local:///opt/jobs/report/job.py
  arguments: ["--runs", "RUNS"]
  deps:
    pyFiles:
      - local:///opt/jobs/lib/lakehouse.py
      - local:///opt/jobs/report/metrics.py
  sparkConf:
    # Small inputs: a few shuffle partitions instead of 200.
    spark.sql.shuffle.partitions: "4"
    spark.sql.session.timeZone: UTC
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark
    envFrom:
      - configMapRef:
          name: lakehouse-config
      - secretRef:
          name: lakehouse-credentials
  executor:
    instances: 1
    cores: 1
    memory: 1g
    envFrom:
      - configMapRef:
          name: lakehouse-config
      - secretRef:
          name: lakehouse-credentials
