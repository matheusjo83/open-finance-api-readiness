# History job (jobs/history): a seeded 90-day history of PCM reports of both sides, with
# operational defects built in, and its labels, in s3a://lakehouse/ (docs/history.md).
# make history fills in the seed and the volume.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: history
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  # Built locally and loaded into kind (make image).
  image: ofar/spark:local
  imagePullPolicy: Never
  sparkVersion: 3.5.9
  mainApplicationFile: local:///opt/jobs/history/job.py
  arguments: ["--seed", "SEED", "--minutes", "MINUTES", "--per-minute", "PER_MINUTE"]
  deps:
    pyFiles:
      - local:///opt/jobs/lib/lakehouse.py
      - local:///opt/jobs/history/generator.py
  sparkConf:
    spark.sql.shuffle.partitions: "4"
    spark.sql.session.timeZone: UTC
  restartPolicy:
    type: Never
  # As the other jobs: 1g of heap, 768m of overhead (decisions 35 and 37).
  driver:
    cores: 1
    memory: 1g
    memoryOverhead: 768m
    serviceAccount: spark
    envFrom:
      - configMapRef:
          name: lakehouse-config
      - secretRef:
          name: lakehouse-credentials
  executor:
    instances: 1
    cores: 1
    memory: 1g
    memoryOverhead: 768m
    envFrom:
      - configMapRef:
          name: lakehouse-config
      - secretRef:
          name: lakehouse-credentials
