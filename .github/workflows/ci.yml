# checks: lints the pinned Open Finance Brasil specifications with Spectral (make lint-specs),
# checks the operational requirements against them (make check-requirements) and tests the
# services against them: the transmitter (make transmitter-test), the defect proxy (make
# proxy-test), the contract validator (make validator-test), and the business-rules job and the
# detection report with a local Spark (make jobs-test).
# platform: brings the local platform up in kind, exactly as `make up` does on a laptop, and runs
# the smoke job (an Iceberg table written to SeaweedFS through the Postgres catalog and read
# back), then deploys the synthetic transmitter and the defect proxy and calls them from inside
# the cluster (the proxy's labels are read back from SeaweedFS), and runs the contract validator
# through the proxy as a Job, joining its results with the labels and pairing the PCM reports of
# both sides, then the business-rules job and the detection report over that run as
# SparkApplications (the report gates the invariants).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # uv at the version pinned in the Makefile, and its download cache (Python, wheels).
      - uses: actions/cache@v6
        with:
          path: |
            .bin
            ~/.cache/uv
          key: checks-${{ hashFiles('Makefile', 'services/*/uv.lock', 'jobs/uv.lock') }}

      - name: Lint specifications (Spectral)
        run: make lint-specs

      - name: Operational requirements (against the specs, with breakages)
        run: make check-requirements

      - name: Transmitter tests (responses validated against the specs)
        run: make transmitter-test

      - name: Defect proxy tests (every class against the transmitter)
        run: make proxy-test

      - name: Contract validator tests (every class through the proxy)
        run: make validator-test

      - name: Business rules and report tests (local Spark over exported runs)
        env:
          # PySpark 3.5 runs on Java 17, preinstalled on the runner.
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: make jobs-test

  platform:
    # Pinned: ubuntu-latest moves to a new release on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # kind, helm and kubectl at the versions pinned in the Makefile.
      - uses: actions/cache@v6
        with:
          path: .bin
          key: tools-${{ hashFiles('Makefile') }}

      - name: Platform (kind, CloudNativePG, SeaweedFS, Spark Operator)
        run: make platform

      # The Spark image's jars (make jars), keyed on their pinned sums: with a hit, the image
      # build does not reach Maven Central (decision 36).
      - uses: actions/cache@v6
        with:
          path: .cache/jars
          key: jars-${{ hashFiles('images/spark/jars.sha256') }}

      - name: Spark image
        run: make image

      - name: Smoke job
        run: make smoke

      - name: Transmitter (image, deploy, in-cluster check)
        run: make transmitter-deploy transmitter-smoke

      - name: Defect proxy (image, deploy, labels in SeaweedFS)
        run: make proxy-deploy proxy-smoke

      - name: Contract validator (image, Job through the proxy, results joined with the labels)
        run: make validate validator-smoke

      - name: Telemetry (PCM reports of both sides, paired)
        run: make telemetry-smoke

      - name: Business rules (SparkApplication, Iceberg tables)
        run: make business-rules

      - name: Detection report (SparkApplication, gate on precision and recall)
        run: make report-smoke

      # The run's labels, contract results, exchanges, PCM reports and detection report, and the jobs' logs.
      - name: Collect reports
        if: always()
        run: make reports || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: reports/

      - name: Diagnostics
        if: failure()
        run: make diagnose
