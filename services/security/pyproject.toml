[project]
name = "security-tools"
version = "0.1.0"
description = "Security layer (FAPI-BR): the local PKI, the Keycloak realm, the OpenID conformance suite's plan configuration and its runner"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography",
    # The conformance suite's scripts/run-test-plan.py needs these two (its requirements.txt).
    "httpx",
    "pyparsing",
    # The evidence images of the suite's review placeholders (evidence.py).
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Only versions published at least two weeks before the lock was last resolved.
exclude-newer = "2026-11-13T00:00:00Z"

[tool.uv.build-backend]
module-name = "security_tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
